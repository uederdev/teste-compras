spring:
  application:
    name: compras
  datasource:
    url: jdbc:postgresql://${DB_SERVER}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  config:
    import: optional:file:.env[.properties]

  flyway:
    loggers: slf4j
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      show_sql: true
      format_sql: true

server:
  port: 8081
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: info
    br.com.techagro.compras: debug
    org.hibernate.sql: debug

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
