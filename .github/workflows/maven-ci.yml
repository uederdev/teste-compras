name: Java CI with Maven

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${DB_NAME}
          POSTGRES_USER: ${DB_USER}
          POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
          - "5432:5432"

    steps:
      - name: Download codigo fonte
        uses: actions/checkout@v7

      - name: Configura o JDK - 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurim'
          java-version: 21
          cache: 'maven'


